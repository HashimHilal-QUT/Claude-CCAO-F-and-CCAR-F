<!doctype html>
<html lang="en" data-page="quiz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz Hub | Claude Foundations</title>
<link rel="stylesheet" href="styles.css?v=20261115">
<style>
  /* ==========================================================
     Quiz Hub — Compact academic layout.
     - All "chrome" (bank, domain, mode, timer, score) in one strip
     - Quiz card fills the viewport height
     - Options in a 2-col grid so rationale is visible without scroll
     - Rationale + Next button share a footer row
     ========================================================== */

  :root {
    --q-ink: #1c1c1a;
    --q-muted: #6b6a63;
    --q-rule: #d8d4c8;
    --q-paper: #f7f5ee;
    --q-card: #fdfcf8;
    --q-accent: #8a3a1e;
    --q-accent-soft: #f1e3da;
    --q-correct: #2f6b4c;
    --q-correct-soft: #e6efe6;
    --q-wrong: #9a3324;
    --q-wrong-soft: #f6e3df;
    --q-serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --q-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --q-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  body.quiz-hub { background: var(--q-paper); color: var(--q-ink); }

  /* ---- Compact section heading ---- */
  .quiz-hub .study-section { padding: 24px 0 40px; }
  .quiz-hub .section-heading {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
    margin: 0 0 14px; padding: 0 0 10px;
    border-bottom: 1px solid var(--q-rule);
  }
  .quiz-hub .section-heading .eyebrow {
    margin: 0 0 4px; color: var(--q-accent);
    font: 500 10px/1 var(--q-mono); letter-spacing: .18em;
    text-transform: uppercase;
  }
  .quiz-hub .section-heading h2 {
    margin: 0; color: var(--q-ink);
    font: 600 clamp(20px, 2.6vw, 26px)/1.15 var(--q-serif);
    letter-spacing: -0.01em;
  }
  .quiz-hub .results-count {
    margin: 0; color: var(--q-muted);
    font: 400 11px/1.4 var(--q-mono); letter-spacing: .04em;
  }

  /* ---- SINGLE compact control strip ---- */
  .quiz-hub .toolbar {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 0; margin: 0 0 12px;
    border: 1px solid var(--q-rule); border-radius: 4px;
    background: var(--q-card); overflow: hidden;
  }
  .quiz-hub .segmented {
    display: flex; flex: 0 0 auto;
    background: transparent; padding: 0; border-radius: 0;
    border-right: 1px solid var(--q-rule);
  }
  .quiz-hub .segment {
    border: 0; background: transparent; padding: 10px 14px;
    color: var(--q-muted); font: 500 12px/1 var(--q-sans);
    letter-spacing: .01em; position: relative;
  }
  .quiz-hub .segment + .segment { border-left: 1px solid var(--q-rule); }
  .quiz-hub .segment span { color: var(--q-muted); font-weight: 400; font-size: 10px; }
  .quiz-hub .segment:hover { color: var(--q-ink); background: #f2efe5; }
  .quiz-hub .segment.active {
    color: var(--q-accent); background: var(--q-accent-soft);
    box-shadow: inset 0 -2px 0 var(--q-accent);
  }
  .quiz-hub .segment.active span { color: var(--q-accent); }

  .quiz-hub .select-label {
    display: flex; align-items: center; flex: 1 1 200px; min-width: 150px;
    padding: 0 10px; border-right: 1px solid var(--q-rule);
  }
  .quiz-hub #domain-filter {
    width: 100%; border: 0; background: transparent; color: var(--q-ink);
    font: 500 12px/1 var(--q-sans); padding: 11px 2px; outline: none;
    cursor: pointer;
  }

  /* Mode lives inside the strip */
  .quiz-hub .mode-row {
    display: flex; align-items: center; gap: 10px;
    flex: 1 1 auto; min-width: 150px;
    padding: 0 10px; margin: 0;
    border-right: 1px solid var(--q-rule);
  }
  .quiz-hub .mode-switch { display: inline-flex; gap: 4px; }
  .quiz-hub .mode {
    border: 0; background: transparent; color: var(--q-muted);
    font: 500 12px/1 var(--q-sans); padding: 4px 2px;
    border-bottom: 2px solid transparent;
  }
  .quiz-hub .mode.active { color: var(--q-accent); border-bottom-color: var(--q-accent); }
  .quiz-hub .timer-note {
    display: none; /* hidden on compact layout — pacing note shows in timer panel */
  }

  /* Timer compressed to inline form */
  .quiz-hub .timer-panel {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
    margin: 0; padding: 8px 10px;
    background: transparent; border: 0; border-left: 0;
    border-radius: 0; flex: 1 1 260px;
  }
  .quiz-hub .timer-panel .eyebrow { display: none; }
  .quiz-hub .timer-panel > div:first-child {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .quiz-hub .timer-panel strong {
    display: inline-block; color: var(--q-ink);
    font: 600 14px/1 var(--q-mono);
    font-variant-numeric: tabular-nums;
  }
  .quiz-hub .timer-panel #timer-panel-note {
    display: inline; color: var(--q-muted);
    font: 400 11px/1.2 var(--q-sans);
  }
  .quiz-hub .timer-controls { display: flex; gap: 6px; }
  .quiz-hub .timer-panel .button {
    padding: 6px 10px; border-radius: 3px;
    font: 500 11px/1 var(--q-sans);
    border: 1px solid var(--q-rule); white-space: nowrap;
  }
  .quiz-hub .timer-panel .button-primary {
    background: var(--q-accent); color: #fff; border-color: var(--q-accent);
  }
  .quiz-hub .timer-panel .button-secondary { background: transparent; color: var(--q-ink); }

  /* Score: merged into progress header of quiz shell (styling hook only) */
  .quiz-hub .score-card { display: none; }

  /* ---- Quiz shell: fills viewport height ---- */
  .quiz-hub #quiz-view,
  .quiz-hub #study-view {
    margin: 0 auto; max-width: 960px;
  }
  .quiz-hub .quiz-shell {
    display: flex; flex-direction: column;
    min-height: calc(100vh - 260px);
    background: var(--q-card); border: 1px solid var(--q-rule);
    border-radius: 4px;
    padding: clamp(16px, 2.4vw, 26px) clamp(16px, 2.6vw, 30px);
    box-shadow: 0 1px 0 rgba(0,0,0,.02);
  }

  /* Progress row now includes the score */
  .quiz-hub .quiz-progress {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; flex-wrap: wrap; margin: 0 0 8px;
    color: var(--q-muted); font: 500 10px/1.4 var(--q-mono);
    letter-spacing: .12em; text-transform: uppercase;
  }
  .quiz-hub .quiz-progress .quiz-progress-score {
    color: var(--q-accent); letter-spacing: .08em;
  }
  .quiz-hub .quiz-progress .quiz-progress-score::before {
    content: "· "; color: var(--q-rule);
  }
  .quiz-hub .quiz-track {
    height: 2px; background: #e8e4d8; border-radius: 0;
    margin: 0 0 20px;
  }
  .quiz-hub .quiz-track > span {
    display: block; height: 100%; background: var(--q-accent);
    transition: width .25s ease;
  }
  .quiz-hub .quiz-shell h3 {
    font: 600 clamp(16px, 1.8vw, 19px)/1.45 var(--q-serif);
    color: var(--q-ink); margin: 0 0 16px;
    max-width: 100%;
  }

  /* Options: 2-col on desktop so they don't push rationale below fold */
  .quiz-hub .quiz-options {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    border-top: 0; margin: 0 0 4px;
  }
  .quiz-hub .quiz-option {
    display: grid; grid-template-columns: 30px 1fr; align-items: baseline;
    gap: 10px;
    padding: 12px 14px;
    background: var(--q-card); border: 1px solid var(--q-rule);
    border-radius: 3px; color: var(--q-ink);
    font: 400 14px/1.5 var(--q-serif); text-align: left;
    transition: background .12s ease, border-color .12s ease;
  }
  .quiz-hub .quiz-option .letter {
    color: var(--q-accent); font: italic 500 14px/1 var(--q-serif);
    text-align: right; padding: 0;
  }
  .quiz-hub .quiz-option:hover:not(:disabled) {
    background: #f4f1e8; border-color: var(--q-accent);
  }
  .quiz-hub .quiz-option:disabled { cursor: default; }
  .quiz-hub .quiz-option.correct {
    background: var(--q-correct-soft); color: var(--q-correct);
    border-color: #b9d1bd;
  }
  .quiz-hub .quiz-option.correct .letter { color: var(--q-correct); }
  .quiz-hub .quiz-option.incorrect {
    background: var(--q-wrong-soft); color: var(--q-wrong);
    border-color: #e5bdb4;
  }
  .quiz-hub .quiz-option.incorrect .letter { color: var(--q-wrong); }

  /* Rationale + Next row sits directly below options */
  .quiz-hub .quiz-feedback {
    display: grid; grid-template-columns: 1fr auto; align-items: start;
    gap: 16px; margin-top: 14px; padding: 12px 14px;
    background: #f3f0e6; border-left: 3px solid var(--q-accent);
    border-radius: 0 3px 3px 0;
    font: 400 13.5px/1.6 var(--q-serif); color: var(--q-ink);
  }
  .quiz-hub .quiz-feedback > div { min-width: 0; }
  .quiz-hub .quiz-feedback strong {
    display: block; margin-bottom: 4px;
    font: 600 12px/1.4 var(--q-sans); letter-spacing: .01em;
  }
  .quiz-hub .quiz-feedback strong::before {
    content: "Rationale — "; color: var(--q-accent);
    font: 500 10px/1 var(--q-mono); letter-spacing: .14em;
    text-transform: uppercase; margin-right: 4px;
  }
  .quiz-hub .quiz-next {
    display: inline-block; padding: 10px 18px;
    background: var(--q-ink); color: #fff;
    font: 500 11px/1 var(--q-sans); letter-spacing: .08em;
    text-transform: uppercase; border: 0; border-radius: 3px;
    cursor: pointer; white-space: nowrap; align-self: start;
    transition: background .15s ease;
  }
  .quiz-hub .quiz-next:hover { background: var(--q-accent); }
  .quiz-hub .quiz-next:hover { background: var(--q-accent); }

  /* Results page */
  .quiz-hub .quiz-result {
    text-align: center; padding: clamp(24px, 5vw, 48px) 20px;
    min-height: auto;
  }
  .quiz-hub .quiz-result .eyebrow {
    color: var(--q-accent); font: 500 11px/1 var(--q-mono);
    letter-spacing: .18em; text-transform: uppercase; margin: 0 0 14px;
  }
  .quiz-hub .quiz-result strong {
    display: block; color: var(--q-accent);
    font: 600 clamp(52px, 10vw, 76px)/1 var(--q-serif);
    letter-spacing: -0.02em; margin: 0 0 8px;
  }
  .quiz-hub .quiz-result p {
    color: var(--q-muted); font: italic 400 14px/1.5 var(--q-serif);
    max-width: 380px; margin: 0 auto 18px;
  }

  /* Study view: tighter cards */
  .quiz-hub .question-card {
    background: var(--q-card); border: 1px solid var(--q-rule);
    border-radius: 4px; padding: 16px 18px;
    margin: 0 0 12px; box-shadow: none;
  }
  .quiz-hub .question-meta {
    color: var(--q-accent); font: 500 10px/1 var(--q-mono);
    letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px;
  }
  .quiz-hub .question-number { color: var(--q-muted); }
  .quiz-hub .question-card h3 {
    font: 600 15px/1.5 var(--q-serif); color: var(--q-ink);
    margin: 0 0 12px;
  }
  .quiz-hub .options {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    border-top: 0;
  }
  .quiz-hub .option {
    display: grid; grid-template-columns: 24px 1fr; gap: 8px;
    align-items: baseline; padding: 8px 10px;
    background: var(--q-card); border: 1px solid var(--q-rule);
    border-radius: 3px; color: var(--q-ink);
    font: 400 13px/1.45 var(--q-serif);
  }
  .quiz-hub .option .letter {
    color: var(--q-accent); font: italic 500 13px/1 var(--q-serif);
    text-align: right; padding: 0;
  }
  .quiz-hub .reveal {
    margin-top: 10px; padding: 0; border: 0; background: transparent;
    color: var(--q-accent); font: 500 11px/1.4 var(--q-sans);
    letter-spacing: .04em; cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px;
  }
  .quiz-hub .answer-panel {
    margin-top: 10px; padding: 10px 12px;
    background: #f3f0e6; border-left: 3px solid var(--q-accent);
    border-radius: 0 3px 3px 0; color: var(--q-ink);
    font: 400 12.5px/1.6 var(--q-serif);
  }

  /* Empty state */
  .quiz-hub .empty-state {
    text-align: center; padding: 36px 20px;
    color: var(--q-muted); font: italic 400 14px/1.5 var(--q-serif);
  }
  .quiz-hub .empty-state h3 {
    color: var(--q-ink); font: 600 18px/1.3 var(--q-serif);
    margin: 0 0 6px;
  }

  .quiz-hub .hidden { display: none !important; }

  /* ---- Responsive ---- */
  @media (max-width: 900px) {
    .quiz-hub .quiz-options { grid-template-columns: 1fr; }
    .quiz-hub .options { grid-template-columns: 1fr; }
    .quiz-hub .quiz-feedback { grid-template-columns: 1fr; }
    .quiz-hub .quiz-next { justify-self: stretch; text-align: center; }
    .quiz-hub .quiz-shell { min-height: 0; }
  }

  @media (max-width: 720px) {
    .quiz-hub .study-section { padding: 16px 0 32px; }
    .quiz-hub .segmented { width: 100%; border-right: 0; border-bottom: 1px solid var(--q-rule); }
    .quiz-hub .segment { flex: 1; text-align: center; }
    .quiz-hub .select-label { flex: 1 1 100%; border-right: 0; border-bottom: 1px solid var(--q-rule); }
    .quiz-hub .mode-row { flex: 1 1 100%; border-right: 0; padding: 8px 10px; }
    .quiz-hub .timer-panel { flex: 1 1 100%; }
    .quiz-hub .timer-controls { width: 100%; }
    .quiz-hub .timer-controls .button { flex: 1; text-align: center; }
  }

  @media (max-width: 600px) {
    .quiz-hub .section-heading h2 { font-size: 20px; }
    .quiz-hub .quiz-shell { padding: 16px 14px; }
    .quiz-hub .quiz-option { padding: 12px; font-size: 14.5px; grid-template-columns: 26px 1fr; gap: 8px; }
    .quiz-hub .quiz-next { width: 100%; text-align: center; padding: 12px 16px; }
    .quiz-hub .quiz-feedback { padding: 10px 12px; font-size: 13px; }
    .quiz-hub select, .quiz-hub input { font-size: 16px; }
  }
</style>
<script defer src="app.js?v=20261115"></script>
</head>
<body class="quiz-hub">
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">C</span>
      <span><strong>Claude</strong><small>Foundations prep</small></span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav">
      <a href="study.html">Study Hub</a>
      <a class="active" href="quiz.html">Quiz Hub</a>
      <a href="training.html">CCAR-F Intensive Training</a>
    </nav>
  </div>
</header>

<main>
  <section class="study-section">
    <div class="wrap">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Quiz Hub</p>
          <h2>Practice the complete question bank.</h2>
        </div>
        <p id="results-count" class="results-count"></p>
      </div>

      <!-- Single compact strip: bank toggles · domain · mode · timer -->
      <div class="toolbar">
        <div class="segmented">
          <button class="segment active" data-bank="ccaf" type="button">CCAR-F <span>227</span></button>
          <button class="segment" data-bank="ccao" type="button">CCAO-F <span>91</span></button>
        </div>
        <label class="select-label"><select id="domain-filter"></select></label>
        <div class="mode-row">
          <div class="mode-switch">
            <button id="quiz-mode" class="mode active" type="button">Untimed quiz</button>
          </div>
        </div>
        <div id="timer-panel" class="timer-panel">
          <div>
            <strong id="timer-panel-time">Not started</strong>
            <span id="timer-panel-note">2 min/question</span>
          </div>
          <div class="timer-controls">
            <button id="timer-start-stop" class="button button-primary" type="button">Start</button>
            <button id="timer-reset" class="button button-secondary" type="button">Reset</button>
          </div>
        </div>
      </div>

      <span id="timer-note" class="timer-note" hidden></span>

      <!-- Score is now merged into the quiz shell's progress header -->
      <div id="score-card" class="score-card">
        <span>Score</span>
        <strong id="score-value">0 / 0</strong>
        <small id="score-percent">No answers yet</small>
      </div>

      <div id="study-view" class="hidden"></div>
      <div id="quiz-view"></div>
      <div id="empty-state" class="empty-state hidden"><h3>No questions match that filter.</h3></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>Quiz Hub</span>
    <span>Untimed or timed · Full question banks</span>
  </div>
</footer>

<script>
  (function () {
    var btn = document.querySelector('.menu-toggle');
    var nav = document.getElementById('site-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function () {
      var open = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    nav.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') {
        nav.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  })();
</script>
</body>
</html>
