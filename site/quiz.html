<!doctype html>
<html lang="en" data-page="quiz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz Hub | Claude Foundations</title>
<link rel="stylesheet" href="styles.css?v=20261115">
<style>
  /* ==========================================================
     Quiz Hub — Compact academic layout, larger type, fixed toolbar.
     ========================================================== */

  :root {
    --q-ink: #1c1c1a;
    --q-muted: #6b6a63;
    --q-rule: #d8d4c8;
    --q-paper: #f7f5ee;
    --q-card: #fdfcf8;
    --q-accent: #8a3a1e;
    --q-accent-soft: #f1e3da;
    --q-correct: #2f6b4c;
    --q-correct-soft: #e6efe6;
    --q-wrong: #9a3324;
    --q-wrong-soft: #f6e3df;
    --q-serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --q-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --q-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --q-ctrl-h: 38px;      /* uniform control height */
    --q-ctrl-radius: 4px;
  }

  body.quiz-hub { background: var(--q-paper); color: var(--q-ink); }

  /* ---- Section heading ---- */
  .quiz-hub .study-section { padding: 20px 0 32px; }
  .quiz-hub .section-heading {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
    margin: 0 0 14px; padding: 0 0 8px;
    border-bottom: 1px solid var(--q-rule);
  }
  .quiz-hub .section-heading .eyebrow {
    margin: 0 0 4px; color: var(--q-accent);
    font: 500 10px/1 var(--q-mono); letter-spacing: .18em;
    text-transform: uppercase;
  }
  .quiz-hub .section-heading h2 {
    margin: 0; color: var(--q-ink);
    font: 600 clamp(20px, 2.6vw, 26px)/1.15 var(--q-serif);
    letter-spacing: -0.01em;
  }
  .quiz-hub .results-count {
    margin: 0; color: var(--q-muted);
    font: 400 11px/1.4 var(--q-mono); letter-spacing: .04em;
  }

  /* ==========================================================
     TOOLBAR — bordered controls, single aligned row on desktop.
     ========================================================== */
  .quiz-hub .toolbar {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 10px; margin: 0 0 14px;
    padding: 10px;
    background: var(--q-card);
    border: 1px solid var(--q-rule);
    border-radius: var(--q-ctrl-radius);
  }

  /* Bank toggle: segmented control with visible border + dividers */
  .quiz-hub .segmented {
    display: inline-flex;
    height: var(--q-ctrl-h);
    border: 1px solid var(--q-rule);
    border-radius: var(--q-ctrl-radius);
    background: #fff;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .quiz-hub .segment {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    border: 0; background: transparent;
    padding: 0 14px; height: 100%;
    color: var(--q-muted); font: 600 13px/1 var(--q-sans);
    white-space: nowrap;
    transition: background .12s ease, color .12s ease;
  }
  .quiz-hub .segment + .segment { border-left: 1px solid var(--q-rule); }
  .quiz-hub .segment span {
    color: var(--q-muted); font-weight: 400; font-size: 11px;
    font-family: var(--q-mono);
  }
  .quiz-hub .segment:hover { color: var(--q-ink); background: #f5f2e9; }
  .quiz-hub .segment.active {
    color: #fff; background: var(--q-accent);
  }
  .quiz-hub .segment.active span { color: rgba(255,255,255,.8); }

  /* Domain select: bordered, aligned */
  .quiz-hub .select-label {
    display: flex; align-items: center;
    height: var(--q-ctrl-h);
    flex: 1 1 240px; min-width: 200px;
    margin: 0;
    border: 1px solid var(--q-rule);
    border-radius: var(--q-ctrl-radius);
    background: #fff;
    padding: 0 4px 0 12px;
  }
  .quiz-hub #domain-filter {
    width: 100%; height: 100%;
    border: 0; background: transparent; color: var(--q-ink);
    font: 500 13px/1 var(--q-sans);
    padding: 0; outline: none; cursor: pointer;
  }

  /* Mode toggle: bordered pill (single-button variant) */
  .quiz-hub .mode-row {
    display: flex; align-items: center; gap: 6px;
    height: var(--q-ctrl-h);
    flex: 0 0 auto;
    margin: 0; padding: 0;
  }
  .quiz-hub .mode-switch {
    display: inline-flex;
    height: 100%;
    border: 1px solid var(--q-rule);
    border-radius: var(--q-ctrl-radius);
    background: #fff;
    overflow: hidden;
  }
  .quiz-hub .mode {
    display: inline-flex; align-items: center; justify-content: center;
    height: 100%; padding: 0 14px;
    border: 0; background: transparent;
    color: var(--q-muted); font: 600 12px/1 var(--q-sans);
    white-space: nowrap;
  }
  .quiz-hub .mode.active { color: #fff; background: var(--q-ink); }
  .quiz-hub .timer-note { display: none; }

  /* Timer: bordered readout + bordered buttons */
  .quiz-hub .timer-panel {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
    height: var(--q-ctrl-h);
    flex: 0 0 auto;
    margin: 0; padding: 0;
    background: transparent; border: 0;
  }
  .quiz-hub .timer-panel .eyebrow { display: none; }
  .quiz-hub .timer-panel > div:first-child {
    display: inline-flex; align-items: center;
    height: 100%;
    padding: 0 12px;
    border: 1px solid var(--q-rule);
    border-radius: var(--q-ctrl-radius);
    background: #fff;
    gap: 8px;
  }
  .quiz-hub .timer-panel strong {
    display: inline-block; color: var(--q-ink);
    font: 600 13px/1 var(--q-mono);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .quiz-hub .timer-panel #timer-panel-note {
    display: none; /* hidden on wide; visible on small screens below */
  }
  .quiz-hub .timer-controls { display: inline-flex; gap: 6px; height: 100%; }
  .quiz-hub .timer-panel .button {
    display: inline-flex; align-items: center; justify-content: center;
    height: 100%; padding: 0 14px;
    border: 1px solid var(--q-rule);
    border-radius: var(--q-ctrl-radius);
    font: 600 12px/1 var(--q-sans);
    white-space: nowrap;
    background: #fff; color: var(--q-ink);
    transition: background .12s ease, border-color .12s ease;
  }
  .quiz-hub .timer-panel .button:hover { border-color: var(--q-accent); color: var(--q-accent); }
  .quiz-hub .timer-panel .button-primary {
    background: var(--q-accent); color: #fff; border-color: var(--q-accent);
  }
  .quiz-hub .timer-panel .button-primary:hover {
    background: #6f2f17; border-color: #6f2f17; color: #fff;
  }
  .quiz-hub .timer-panel .button-secondary { background: #fff; color: var(--q-ink); }

  /* Score hidden (data still surfaces in progress header) */
  .quiz-hub .score-card { display: none; }

  /* ==========================================================
     QUIZ SHELL
     ========================================================== */
  .quiz-hub #quiz-view,
  .quiz-hub #study-view {
    margin: 0 auto; max-width: 900px;
  }
  .quiz-hub .quiz-shell {
    display: flex; flex-direction: column;
    background: var(--q-card); border: 1px solid var(--q-rule);
    border-radius: 4px;
    padding: clamp(22px, 3vw, 34px) clamp(22px, 3.4vw, 40px);
    box-shadow: 0 1px 0 rgba(0,0,0,.02);
  }

  .quiz-hub .quiz-progress {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; flex-wrap: wrap; margin: 0 0 10px;
    color: var(--q-muted); font: 500 11px/1.4 var(--q-mono);
    letter-spacing: .12em; text-transform: uppercase;
  }
  .quiz-hub .quiz-progress .quiz-progress-score {
    color: var(--q-accent); letter-spacing: .08em;
  }
  .quiz-hub .quiz-track {
    height: 3px; background: #e8e4d8; border-radius: 0;
    margin: 0 0 26px;
  }
  .quiz-hub .quiz-track > span {
    display: block; height: 100%; background: var(--q-accent);
    transition: width .25s ease;
  }

  .quiz-hub .quiz-shell h3 {
    font: 600 clamp(19px, 1.9vw, 22px)/1.45 var(--q-serif);
    color: var(--q-ink); margin: 0 0 22px;
    max-width: 100%;
    letter-spacing: -0.005em;
  }

  .quiz-hub .quiz-options {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin: 0 0 6px;
  }
  .quiz-hub .quiz-option {
    display: grid; grid-template-columns: 34px 1fr; align-items: baseline;
    gap: 12px;
    padding: 16px 18px;
    background: var(--q-card); border: 1px solid var(--q-rule);
    border-radius: 4px; color: var(--q-ink);
    font: 400 17px/1.5 var(--q-serif); text-align: left;
    transition: background .12s ease, border-color .12s ease;
  }
  .quiz-hub .quiz-option .letter {
    color: var(--q-accent); font: italic 600 17px/1 var(--q-serif);
    text-align: right; padding: 0;
  }
  .quiz-hub .quiz-option:hover:not(:disabled) {
    background: #f4f1e8; border-color: var(--q-accent);
  }
  .quiz-hub .quiz-option:disabled { cursor: default; }
  .quiz-hub .quiz-option.correct {
    background: var(--q-correct-soft); color: var(--q-correct);
    border-color: #b9d1bd;
  }
  .quiz-hub .quiz-option.correct .letter { color: var(--q-correct); }
  .quiz-hub .quiz-option.incorrect {
    background: var(--q-wrong-soft); color: var(--q-wrong);
    border-color: #e5bdb4;
  }
  .quiz-hub .quiz-option.incorrect .letter { color: var(--q-wrong); }

  .quiz-hub .quiz-feedback {
    margin: 18px 0 0;
    padding: 18px 20px 18px 22px;
    background: #f3f0e6;
    border-left: 4px solid var(--q-accent);
    border-radius: 0 4px 4px 0;
    font: 400 15.5px/1.65 var(--q-serif); color: var(--q-ink);
  }
  .quiz-hub .quiz-feedback strong {
    display: block; margin-bottom: 8px;
    font: 600 14px/1.4 var(--q-sans); letter-spacing: .01em;
  }
  .quiz-hub .quiz-feedback strong::before {
    content: "Rationale — "; color: var(--q-accent);
    font: 500 11px/1 var(--q-mono); letter-spacing: .14em;
    text-transform: uppercase; margin-right: 4px;
  }
  .quiz-hub .quiz-feedback .quiz-next { display: block; margin: 16px 0 0 auto; }

  .quiz-hub .quiz-next {
    display: inline-block; padding: 12px 22px;
    background: var(--q-ink); color: #fff;
    font: 500 12px/1 var(--q-sans); letter-spacing: .08em;
    text-transform: uppercase; border: 0; border-radius: 3px;
    cursor: pointer; white-space: nowrap;
    transition: background .15s ease;
  }
  .quiz-hub .quiz-next:hover { background: var(--q-accent); }

  .quiz-hub .quiz-result {
    text-align: center; padding: clamp(24px, 5vw, 48px) 20px;
  }
  .quiz-hub .quiz-result .eyebrow {
    color: var(--q-accent); font: 500 11px/1 var(--q-mono);
    letter-spacing: .18em; text-transform: uppercase; margin: 0 0 14px;
  }
  .quiz-hub .quiz-result strong {
    display: block; color: var(--q-accent);
    font: 600 clamp(56px, 11vw, 84px)/1 var(--q-serif);
    letter-spacing: -0.02em; margin: 0 0 10px;
  }
  .quiz-hub .quiz-result p {
    color: var(--q-muted); font: italic 400 15.5px/1.55 var(--q-serif);
    max-width: 400px; margin: 0 auto 20px;
  }
  .quiz-hub .quiz-result .quiz-next { margin: 0 auto; display: inline-block; }

  .quiz-hub .question-card {
    background: var(--q-card); border: 1px solid var(--q-rule);
    border-radius: 4px; padding: 20px 22px;
    margin: 0 0 14px; box-shadow: none;
  }
  .quiz-hub .question-meta {
    color: var(--q-accent); font: 500 11px/1 var(--q-mono);
    letter-spacing: .14em; text-transform: uppercase; margin: 0 0 10px;
  }
  .quiz-hub .question-number { color: var(--q-muted); }
  .quiz-hub .question-card h3 {
    font: 600 18px/1.5 var(--q-serif); color: var(--q-ink);
    margin: 0 0 16px;
  }
  .quiz-hub .options {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .quiz-hub .option {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px;
    align-items: baseline; padding: 12px 14px;
    background: var(--q-card); border: 1px solid var(--q-rule);
    border-radius: 4px; color: var(--q-ink);
    font: 400 15px/1.5 var(--q-serif);
  }
  .quiz-hub .option .letter {
    color: var(--q-accent); font: italic 600 15px/1 var(--q-serif);
    text-align: right; padding: 0;
  }
  .quiz-hub .reveal {
    margin-top: 14px; padding: 0; border: 0; background: transparent;
    color: var(--q-accent); font: 500 12px/1.4 var(--q-sans);
    letter-spacing: .04em; cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px;
  }
  .quiz-hub .answer-panel {
    margin-top: 14px; padding: 14px 16px;
    background: #f3f0e6; border-left: 4px solid var(--q-accent);
    border-radius: 0 4px 4px 0; color: var(--q-ink);
    font: 400 14.5px/1.65 var(--q-serif);
  }

  .quiz-hub .empty-state {
    text-align: center; padding: 36px 20px;
    color: var(--q-muted); font: italic 400 15px/1.5 var(--q-serif);
  }
  .quiz-hub .empty-state h3 {
    color: var(--q-ink); font: 600 19px/1.3 var(--q-serif);
    margin: 0 0 6px;
  }

  .quiz-hub .hidden { display: none !important; }

  /* ---- Responsive ---- */
  @media (max-width: 900px) {
    .quiz-hub .quiz-options { grid-template-columns: 1fr; }
    .quiz-hub .options { grid-template-columns: 1fr; }
  }

  @media (max-width: 720px) {
    .quiz-hub .study-section { padding: 14px 0 28px; }
    .quiz-hub .toolbar { gap: 8px; padding: 8px; }
    .quiz-hub .segmented { flex: 1 1 100%; }
    .quiz-hub .segment { flex: 1; }
    .quiz-hub .select-label { flex: 1 1 100%; min-width: 0; }
    .quiz-hub .mode-row { flex: 1 1 auto; }
    .quiz-hub .mode-switch { width: 100%; }
    .quiz-hub .mode { flex: 1; }
    .quiz-hub .timer-panel {
      flex: 1 1 100%; height: auto;
      flex-direction: column; align-items: stretch;
      gap: 6px;
    }
    .quiz-hub .timer-panel > div:first-child {
      height: var(--q-ctrl-h); width: 100%; justify-content: space-between;
    }
    .quiz-hub .timer-panel #timer-panel-note { display: inline; }
    .quiz-hub .timer-controls { width: 100%; height: var(--q-ctrl-h); }
    .quiz-hub .timer-controls .button { flex: 1; }
  }

  @media (max-width: 600px) {
    .quiz-hub .section-heading h2 { font-size: 20px; }
    .quiz-hub .quiz-shell { padding: 18px 16px 22px; }
    .quiz-hub .quiz-shell h3 { font-size: 18px; }
    .quiz-hub .quiz-option { padding: 14px 14px; font-size: 16px; grid-template-columns: 28px 1fr; gap: 10px; }
    .quiz-hub .quiz-option .letter { font-size: 16px; }
    .quiz-hub .quiz-next { width: 100%; text-align: center; padding: 13px 16px; }
    .quiz-hub .quiz-feedback { padding: 14px 16px; font-size: 15px; }
    .quiz-hub .quiz-feedback .quiz-next { margin-top: 14px; }
    .quiz-hub select, .quiz-hub input { font-size: 16px; }
  }
</style>
<script defer src="app.js?v=20261124-ud-ccar-f"></script>
</head>
<body class="quiz-hub">
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">C</span>
      <span><strong>Claude</strong><small>Foundations prep</small></span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav">
      <a href="study.html">Study Hub</a>
      <a class="active" href="quiz.html">Quiz Hub</a>
      <a href="quiz.html?bank=ud-ccar-f">UD-CCAR-F 360-Question Quiz</a>
      <a href="training.html">CCAR-F Intensive Training</a>
    </nav>
  </div>
</header>

<main>
  <section class="study-section">
    <div class="wrap">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Quiz Hub</p>
          <h2>Practice the complete question bank.</h2>
        </div>
        <p id="results-count" class="results-count"></p>
      </div>

      <!-- Single aligned toolbar: bank toggles · domain · mode · timer -->
      <div class="toolbar">
        <div class="segmented">
          <button class="segment active" data-bank="ccaf" type="button">CCAR-F <span>227</span></button>
          <button class="segment" data-bank="ccao" type="button">CCAO-F <span>91</span></button>
          <button class="segment" data-bank="ud-ccar-f" type="button">UD-CCAR-F <span>360</span></button>
        </div>

        <label class="select-label">
          <select id="domain-filter" aria-label="Domain filter"></select>
        </label>
        <label class="select-label">
          <select id="practice-test-filter" aria-label="Practice test filter"></select>
        </label>

        <div class="mode-row">
          <div class="mode-switch">
            <button id="quiz-mode" class="mode active" type="button">Untimed quiz</button>
          </div>
        </div>

        <div id="timer-panel" class="timer-panel">
          <div>
            <strong id="timer-panel-time">Not started</strong>
            <span id="timer-panel-note">2 min/question</span>
          </div>
          <div class="timer-controls">
            <button id="timer-start-stop" class="button button-primary" type="button">Start</button>
            <button id="timer-reset" class="button button-secondary" type="button">Reset</button>
          </div>
        </div>
      </div>

      <span id="timer-note" class="timer-note" hidden></span>

      <div id="score-card" class="score-card">
        <span>Score</span>
        <strong id="score-value">0 / 0</strong>
        <small id="score-percent">No answers yet</small>
      </div>

      <div id="study-view" class="hidden"></div>
      <div id="quiz-view"></div>
      <div id="empty-state" class="empty-state hidden"><h3>No questions match that filter.</h3></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>Quiz Hub</span>
    <span>Untimed or timed · Full question banks</span>
  </div>
</footer>

<script>
  (function () {
    var btn = document.querySelector('.menu-toggle');
    var nav = document.getElementById('site-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', function () {
      var open = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    nav.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') {
        nav.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  })();
</script>
</body>
</html>
